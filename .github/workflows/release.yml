# Сборка установщика для Windows. Запускается при пуше тега v*, например v0.1.0.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Free Touch ${{ github.ref_name }}
          releaseBody: |
            Установщик для Windows — файл `Free.Touch_…_x64-setup.exe` ниже.
            Телефон подключается через браузер по QR-коду, отдельное приложение ставить не нужно.
          releaseDraft: true
          prerelease: false
